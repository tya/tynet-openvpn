apiVersion: v1
kind: ServiceAccount
metadata:
  name: tynet-openvpn
  namespace: {{ .Values.namespace }}
---
# Secrets-only, namespace-scoped. The pod uses this (via its own mounted
# token, no kubeconfig) to restore the CA/server PKI and each enrolled
# user's TOTP secret from Secrets on every start, and to persist them on
# first run / enrollment -- that's what lets this pod reschedule across
# any node without a node-local PVC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tynet-openvpn
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tynet-openvpn
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: tynet-openvpn
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: tynet-openvpn
  apiGroup: rbac.authorization.k8s.io
