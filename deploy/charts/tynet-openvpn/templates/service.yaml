apiVersion: v1
kind: Service
metadata:
  name: tynet-openvpn
  namespace: {{ .Values.namespace }}
  annotations:
    metallb.universe.tf/loadBalancerIPs: {{ .Values.service.loadBalancerIP | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  selector:
    app: tynet-openvpn
  ports:
    - name: openvpn
      port: {{ .Values.openvpn.port }}
      targetPort: {{ .Values.openvpn.port }}
      protocol: {{ .Values.openvpn.proto | upper }}
